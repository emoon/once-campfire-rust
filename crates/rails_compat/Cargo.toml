[package]
name = "rails_compat"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde_json = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }

[features]
# Everything but `erb`, `rack` and `ruby`: the message verifier and encryptor, cookies, GlobalID,
# signed ids and passwords. Crates that only need those three leave it off and skip building the
# crypto crates.
crypto = [
    "dep:serde_json",
    "dep:jiff",
    "dep:thiserror",
    "dep:base64",
    "dep:hmac",
    "dep:sha1",
    "dep:sha2",
    "dep:pbkdf2",
    "dep:aes-gcm",
    "dep:rand",
    "dep:hex",
    "dep:bcrypt",
]

[dev-dependencies]
rails_compat = { path = ".", features = ["crypto"] }

[lints]
workspace = true
